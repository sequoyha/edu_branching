name: Push PR Comments to Jira

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  sync-comment:
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      # Step 1: Securely log into Jira using your secrets
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          PR_TITLE: "${{ github.event.issue.title || github.event.pull_request.title }}"
          PR_BODY: "${{ github.event.issue.body || github.event.pull_request.body }}"
          COMMENT_BODY: "${{ github.event.comment.body }}"
          COMMENT_AUTHOR: "${{ github.event.comment.user.login }}"
        run: |
          # 1. Search for a Jira Key (e.g., PROJ-123) in the PR title or body
          JIRA_KEY=$(echo "$PR_TITLE $PR_BODY" | grep -oE '[A-Z]+-[0-9]+' | head -n 1)
          
          if [ -z "$JIRA_KEY" ]; then
            echo "No valid Jira issue key found in the PR title or description."
            exit 0
          fi
          echo "Found Jira Key: $JIRA_KEY"
          
          # 2. Safely structure the message payload for the Jira API
          FORMATTED_COMMENT="GitHub User *$COMMENT_AUTHOR* commented:\n\n$COMMENT_BODY"
          
          # 3. Use jq to safely escape quotes and multi-line breaks into valid JSON
          JSON_PAYLOAD=$(jq -n --arg msg "$FORMATTED_COMMENT" '{body: $msg}')

          # 4. Make a direct API call to your Jira instance
          RESPONSE=$(curl -s -w "%{http_code}" -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            -d "$JSON_PAYLOAD" \
            "$JIRA_BASE_URL/rest/api/2/issue/$JIRA_KEY/comment")

          # 5. Extract HTTP Status code to verify delivery
          HTTP_STATUS="${RESPONSE:${#RESPONSE}-3}"
          
          if [ "$HTTP_STATUS" -eq 201 ]; then
            echo "Successfully posted comment to Jira issue $JIRA_KEY."
          else
            echo "Jira API returned error code: $HTTP_STATUS"
            echo "Full Response payload: $RESPONSE"
            exit 1
          fi
