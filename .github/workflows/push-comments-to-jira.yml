name: Push PR Comments to Jira
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  sync-comment:
    # Only run if the comment is on a Pull Request
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira Key and Post Comment
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }} # e.g., https://atlassian.net
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: |
          # 1. Get the PR title or body to extract the Jira Issue Key
          PR_BODY="${{ github.event.issue.body || github.event.pull_request.body }}"
          PR_TITLE="${{ github.event.issue.title || github.event.pull_request.title }}"
          
          # Regex to find something like PROJ-123
          JIRA_KEY=$(echo "$PR_TITLE $PR_BODY" | grep -oE '[A-Z]+-[0-9]+' | head -n 1)
          
          if [ -z "$JIRA_KEY" ]; then
            echo "No Jira issue key found in PR title or body."
            exit 0
          fi
          
          # 2. Extract comment author and text
          COMMENT_BODY="${{ github.event.comment.body }}"
          COMMENT_AUTHOR="${{ github.event.comment.user.login }}"
          FORMATTED_COMMENT="GitHub User *$COMMENT_AUTHOR* commented:\n\n$COMMENT_BODY"

          # 3. Post to Jira API
          curl -s -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            -X POST \
            -H "Content-Type: application/json" \
            --data "{\"body\": \"$FORMATTED_COMMENT\"}" \
            "$JIRA_BASE_URL/rest/api/3/issue/$JIRA_KEY/comment"
