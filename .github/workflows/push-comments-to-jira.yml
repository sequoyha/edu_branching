name: Push PR Comments to Jira

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  sync-comment:
    if: github.event.issue.pull_request || github.event.pull_request
    runs-on: ubuntu-latest
    steps:
      # Step 1: Securely log into Jira using your secrets
      - name: Login to Jira
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

      # Step 2: Automatically search the PR title/body for a Jira key (e.g., PROJ-123)
      - name: Find Jira Issue Key
        id: find_key
        uses: atlassian/gajira-find-issue-key@v3
        with:
          string: "${{ github.event.issue.title }} ${{ github.event.issue.body }} ${{ github.event.pull_request.title }} ${{ github.event.pull_request.body }}"

      # Step 3: Post the comment to Jira if an issue key was successfully found
      - name: Post Comment to Jira
        if: steps.find_key.outputs.issue != ''
        uses: atlassian/gajira-comment@v3
        with:
          issue: ${{ steps.find_key.outputs.issue }}
          comment: "GitHub User *${{ github.event.comment.user.login }}* commented:\n\n${{ github.event.comment.body }}"
